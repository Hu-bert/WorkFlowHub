# Przykładowy katalog repozytoriów — punkt startu przy pierwszym uruchomieniu FlowHub.
# Twój własny katalog leży w folderze ustawień (%LOCALAPPDATA%\FlowHub\repos.yaml) i edytujesz go
# w aplikacji: Repozytoria → Katalog repo. Tego pliku nie trzeba zmieniać.
#
#   name                   - nazwa repo (nazwa katalogu klonu w zadaniu)
#   url                    - adres klonu (demo:// = repo demonstracyjne tworzone lokalnie, bez sieci)
#   defaultBranch          - branch, od którego odchodzi branch zadania
#   ciBuildConfigurations  - id build configuration w TeamCity
#   deployProject          - projekt (slug) w Octopus Deploy; puste = nazwa repo
#   keywords               - słowa, po których FlowHub rozpoznaje repo z treści zadania
#   processes              - procesy / usługi na maszynach (host, name, label) sprawdzane po wdrożeniu
repositories:
  - name: Billing.Api
    url: demo://Billing.Api
    defaultBranch: main
    ciBuildConfigurations: [Billing_Api_Build]
    deployProject: Billing.Api
    keywords: [faktura, faktury, płatność, billing, rozliczenie]

  - name: Shared.Lib
    url: demo://Shared.Lib
    defaultBranch: main
    ciBuildConfigurations: [Shared_Lib_Build]
    deployProject: Shared.Lib
    keywords: [biblioteka wspólna, kontrakt, nuget, shared]

  - name: Customer.Portal
    url: demo://Customer.Portal
    defaultBranch: main
    ciBuildConfigurations: [Customer_Portal_Build, Customer_Portal_E2E]
    deployProject: Customer.Portal
    keywords: [portal, klient, logowanie, formularz, frontend]
